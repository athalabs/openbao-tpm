# A throwaway pod for exercising openbao-tpm against a real node TPM.
#
# Deliberately NOT part of any Flux kustomization: it is applied by hand during
# the prototype and deleted afterwards (`just clean-probe`). Nothing here belongs
# in the cluster's desired state.
#
# It mounts /dev/tpmrm0 from the host, which needs a privileged container. The
# production shape should instead request the device through a TPM device plugin
# so the pod stays unprivileged.
---
# Its own namespace: `default` enforces the baseline Pod Security standard,
# which forbids both hostPath and privileged. Deleting this namespace removes
# every trace of the prototype.
apiVersion: v1
kind: Namespace
metadata:
  name: tpm-probe
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Pod
metadata:
  name: tpm-probe-NODE_PLACEHOLDER
  namespace: tpm-probe
  labels:
    app.kubernetes.io/name: tpm-probe
spec:
  # Pinned: the whole point is to test one specific machine's TPM.
  nodeName: NODE_PLACEHOLDER
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: probe
      image: alpine:3.22
      command: ["sleep", "28800"]
      securityContext:
        privileged: true
      env:
        # The pod hostname is the pod name; the tool records the node instead.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: tpm
          mountPath: /dev/tpmrm0
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: tpm
      hostPath:
        path: /dev/tpmrm0
        type: CharDevice
